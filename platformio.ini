; PlatformIO Project Configuration File
; ESP32 + BNO085 即時姿態 Demo / OTA / WiFi 設定 / AP fallback
;
; 建置與燒錄:
;   1. 燒錄韌體:      pio run -t upload
;   2. 上傳網頁檔案:  pio run -t uploadfs      (把 data/ 內容寫進 LittleFS)
;   3. 序列埠監看:    pio device monitor
;
; 之後更新韌體可直接用網頁 OTA,不必接線。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 指定序列埠。本機同時存在 FTDI / Prolific / 藍牙等多個序列裝置,
; PlatformIO 的 auto-detect 會挑錯(曾挑到 FTDI 的 COM14)。
; ESP32 開發板是 Silicon Labs CP210x -> COM6。
; 若換 USB 孔或換板子導致編號變動,用這行查:
;   pio device list
upload_port  = COM6
monitor_port = COM6

; LittleFS 檔案系統(存放網頁)
board_build.filesystem = littlefs

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=3000

lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.0
